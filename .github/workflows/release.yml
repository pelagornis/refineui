name: Release

# Publish to npm when a package tag is pushed (e.g. @refineui/react@0.0.4).
# Version bumps stay on the Version workflow / changesets PR — not on every
# push to main.
#
# Auth is npm trusted publishing (OIDC). It requires, per package, a trusted
# publisher on npmjs.com pointing at this repo and this filename (release.yml).
# A package's very first version still needs NPM_TOKEN; the secret is honoured
# when present and ignored once every package is registered.

on:
  push:
    tags:
      - "@refineui/*@*"
  workflow_dispatch:

concurrency:
  # Serialize across package tags so parallel tag pushes do not race npm publish.
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint the OIDC token that npm exchanges for publish rights.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so tag → commit resolution and changelogs stay accurate.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `registry-url` is what makes setup-node write the npm userconfig that
      # the OIDC exchange reads; without it npm never attempts trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm to a trusted-publishing capable release
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
