name: Release

# Two-phase release driven by changesets:
#   1. main has pending changesets  -> open/update the "chore: version packages" PR
#   2. that PR is merged            -> build packages/* and publish them to npm
#
# Auth is npm trusted publishing (OIDC), so no long-lived token is needed. It
# requires, per package, a trusted publisher on npmjs.com pointing at this repo
# and this filename (release.yml). npm only lets you attach that configuration
# to a package that already exists, so a package's very first version still has
# to go out with NPM_TOKEN; the secret is honoured when present and ignored once
# every package is registered.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lets the runner mint the OIDC token that npm exchanges for publish rights.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # changesets needs the full history to diff against the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `registry-url` is what makes setup-node write the npm userconfig that
      # the OIDC exchange reads; without it npm never attempts trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Dependencies are installed by bun, and there is no package-lock.json
          # for setup-node's npm cache to key on.
          package-manager-cache: false

      # The runner's bundled npm predates trusted publishing.
      - name: Pin npm to a trusted-publishing capable release
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback auth for packages that have no trusted publisher yet. Empty
          # when the secret is unset, which leaves OIDC as the only credential.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
