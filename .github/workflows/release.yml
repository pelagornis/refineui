name: Release

# One changesets pipeline on every push to main:
#   - pending changesets → open/update the "chore: version packages" PR
#   - no pending changesets (e.g. that PR was just merged) → build and publish
#     every unpublished workspace version, push its tag, and create the
#     GitHub release. Re-runs are no-ops: published versions are skipped.
#
# Auth is npm trusted publishing (OIDC). It requires, per package, a trusted
# publisher on npmjs.com pointing at this repo and this filename (release.yml),
# so keep publishing in this file. A package's very first version still needs
# NPM_TOKEN; the secret is honoured when present and ignored once every
# package is registered.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a run mid-publish; queue the next push behind it instead.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      # Version PR commits, tags, and GitHub releases.
      contents: write
      pull-requests: write
      # Lets the runner mint the OIDC token that npm exchanges for publish rights.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so tag → commit resolution and changelogs stay accurate.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `registry-url` is what makes setup-node write the npm userconfig that
      # the OIDC exchange reads; without it npm never attempts trusted publishing.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm to a trusted-publishing capable release
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
