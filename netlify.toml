# RefineUI docs — Netlify deploy
#
# `base` is pinned here on purpose. Netlify resolves config in the order
# package directory -> base directory -> repo root, and every path below is
# resolved against `base` regardless of where this file lives. Declaring it
# makes the Netlify UI's build fields inert, so `publish` cannot drift into
# `docs/docs/dist`.
#
# `bun run build` in `docs/` builds @refineui/react (which chains utilities and
# tokens) before `astro build`. That is required, not an optimization:
# `docs/src/styles/global.css` imports `packages/tokens/tailwind.css`, which
# imports `packages/tokens/dist/*` — generated output that is not committed.

[build]
  base = "docs"
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  BUN_VERSION = "1.3.14"
  BUN_FLAGS = "--frozen-lockfile"

# Locale-agnostic public files.
#
# `astro.config.mjs` declares the same redirects so they work in `astro dev`,
# but a static build emits them as meta-refresh HTML (`/ko/DESIGN.md/index.html`).
# Agents fetching these URLs need a real 301, so `force` takes precedence over
# the generated file.

[[redirects]]
  from = "/ko/DESIGN.md"
  to = "/DESIGN.md"
  status = 301
  force = true

[[redirects]]
  from = "/ko/llms.txt"
  to = "/llms.txt"
  status = 301
  force = true

[[redirects]]
  from = "/ko/llm.txt"
  to = "/llm.txt"
  status = 301
  force = true

[[redirects]]
  from = "/ko/mcp.example.json"
  to = "/mcp.example.json"
  status = 301
  force = true

[[redirects]]
  from = "/ko/robots.txt"
  to = "/robots.txt"
  status = 301
  force = true

[[redirects]]
  from = "/ko/favicon.svg"
  to = "/favicon.svg"
  status = 301
  force = true

# AI-facing indexes are fetched cross-origin by agents and MCP clients.

[[headers]]
  for = "/DESIGN.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llm.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/mcp.example.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Content-hashed build output.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
