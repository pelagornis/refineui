version: "1"

project:
  name: refineui
  type: web-react
  description: RefineUI — React/TypeScript design system monorepo (packages/react, packages/tokens, packages/utilities, docs)

tools:
  claude_code: false
  codex: false
  cursor: true

context:
  tech_stack:
    - React
    - TypeScript
    - bun workspace
    - "@refineui/tokens"
    - "@refineui/react"
    - "@refineui/web-icons"
    - Astro + Starlight (docs/)

  summary: |
    RefineUI is a React/TypeScript design system monorepo.
    Packages: packages/react, packages/tokens, packages/utilities, packages/version.
    Docs site: docs/ (https://design.pelagornis.com/refineui). Machine-readable index: /llm.txt.
    Keep the packages/ layout unchanged. Follow existing exports, peer dependencies, and patterns.
    Treat code + docs as the source of truth.
    Respond in the user's chosen language. When referring to code, give path and line.
    Minimal change principle — reuse before implementing; preserve existing behavior unless requested.

  path_rules:
    - name: system-core
      path: ["**/*"]
      description: Base rules for all prompts (required)
      content: |
        # System Core (required rules)

        ## Scope
        MUST: Apply identically across the monorepo. Language and framework neutral where possible.

        ## Role and response
        MUST: Understand the request, reflect context, and only provide actionable results.
        MUST: For ambiguous requirements, pick one reasonable interpretation, state it, then proceed.
        MUST: Structure responses (steps, code blocks, file:line references).

        ## Code quality
        MUST: Naming must reveal intent. No magic numbers or strings — use constants or config.
        MUST: Keep existing indentation, quotes, naming, and directory structure. New code must follow existing patterns.
        MUST: Functions and classes have single responsibility. No repeated logic — extract to shared utils/components.
        MUST: Minimize dependencies. Respect bun.lock; do not change versions arbitrarily.

        ## Web — RefineUI (required)
        MUST: Follow React/TypeScript conventions. Monorepo packages: react, tokens, utilities, version.
        MUST: Follow existing package exports and peer dependencies. New code must match existing patterns.
        MUST: Consider a11y (semantics, ARIA, keyboard, focus), responsive layout. Keep component API consistent with @refineui/*.
        MUST NOT: Ship secrets in client code or build output. Consider XSS, CORS, CSP. No PII in logs or errors.

        ## Security
        MUST NOT: Put secrets, keys, or tokens in code, commits, or comments. Use env or a secret manager only.
        MUST: Validate user and external input before use.
        MUST NOT: Include secrets or PII in logs, errors, or responses.

        ## Errors and robustness
        MUST: Always consider failure cases: network, files, API, bad input, timeouts.
        MUST: Error messages must be specific enough to debug.

        ## Documentation and maintenance
        MUST: Comments explain "why" only. Document public APIs.
        MUST: Do not make breaking or behavior changes without checking call sites and compatibility.
        MUST: When changing public APIs, update docs/src/content/docs and previews together.

        ## Collaboration and checks
        MUST: Before submitting — style match, error handling, no secrets, tests/validation, existing behavior preserved.

        ## Exceptions
        Only relax a rule when the user explicitly says so.

    - name: design-system
      path: ["packages/react/**", "packages/tokens/**", "docs/**"]
      description: RefineUI design system — tokens, components, and docs (code-first)
      content: |
        # Design system (code-first)

        **Source of truth:** `packages/tokens`, `packages/react`, and `docs/`.

        ## Architecture

        | Layer | Role | Location |
        |-------|------|----------|
        | **Primitive / Foundation** | Raw palette, spacing, radius, typography, motion, foundation sizes | `packages/tokens/src/global/*.ts` |
        | **Semantic** | Meaningful aliases (colors, motion roles, elevation, text roles) | `packages/tokens/src/semantic/*.ts` |
        | **Component tokens** | Per-component color / typography / size roles | `packages/react/src/tokens/*` |
        | **Components** | Shipped UI | `packages/react/src/components/*` |
        | **Docs** | Live previews, API reference, usage | `docs/src/content/docs/` |

        ## Token package layout (`packages/tokens/src/global/`)

        - `colors.ts` — palette primitives
        - `fonts.ts`, `typographys.ts` — font families, sizes, weights, line heights, type scale
        - `spacings.ts` — sizeNone ~ sizeXXXLarge
        - `foundationSizes.ts` — Global/Size steps (aliases for component dimensions)
        - `strokeWidths.ts`, `borderRadii.ts`, `shadows.ts`, `motion.ts`, `zIndex.ts`
        - `semantic/colors.ts` — `--refineui-color-alias-*` (light/dark)
        - `semantic/componentSizes.ts` — component dimension aliases → foundationSizes
        - `semantic/interaction.ts` — motion roles (duration, easing, scale)

        Build: `bun run build:tokens` → `dist/css-variables.css`, `dist/tailwind-theme.css`.

        ## Component rules

        - **MUST**: Match existing component patterns in `packages/react` — read a sibling component before adding or changing APIs.
        - **MUST**: Use design tokens only for color, spacing, radius, stroke, typography, shadow, z-index, motion. See `tokens-in-components`.
        - **MUST**: Composable subcomponent APIs only — no convenience props (`title`, `description`, `items`, `actions`, `onClose`).
        - **MUST NOT**: Invent variants, props, or dimensions that are not reflected in tokens + an existing component pattern.
        - **RECOMMENDED**: Add or update `docs/src/content/docs/components/*.mdx` and catalog previews when shipping components.

        ## Docs & AI context

        - Site: https://design.pelagornis.com/refineui
        - Foundations: `/foundations/*` (color, typography, spacing, layout, …)
        - Components: flat A–Z catalog under `/components/*`
        - Iconography: external — https://github.com/pelagornis/refineui-system-icons
        - LLM indexes: `docs/public/llm.txt`, `llms.txt`

        ## Stylesheet (product apps)

        ```css
        @import "@refineui/tokens/tailwind.css";
        @import "@refineui/web-icons/dist/fonts/refineui-system-icons.css";
        @import "@refineui/react/refineui.css";
        ```

    - name: tokens-in-components
      path: ["packages/react/**/*.{ts,tsx}"]
      description: React components take design values only from @refineui/tokens and @refineui/react token maps
      content: |
        # Tokens in components (`@refineui/react`)

        Color, padding, spacing, radius, motion, and dimensions come from `@refineui/tokens` and component token maps — never from ad-hoc literals.

        See `design-system` rule for package layout.

        ## MUST
        - **Color·spacing·radius·stroke·typography·shadow·z-index·motion** come only from `@refineui/tokens` or resolved component token refs.
        - **Foundation size scale** is referenced via **`foundationSizes`** / CSS `--refineui-size-foundation-size-*`.
        - **Component dimensions** come only from **`componentSizes`** (aliases of foundationSizes). **Icon glyphs** use **`iconSizes`**; modal scrim uses **`overlays`**.
        - **No hardcoding**: no arbitrary `px`, `#hex`, or `rgb()` in component styles. (Exceptions: literal `0`, `minWidth: 0`.)
        - When new dimensions are needed, extend `foundationSizes` then `componentSizes` in `packages/tokens` first.

        ## RECOMMENDED
        - Documentation previews use the same tokens and semantic alias utilities (`bg-refineui-alias-*`, `text-refineui-alias-*`).

    - name: composition-only-components
      path: ["packages/react/**/*.{ts,tsx}"]
      description: RefineUI component APIs are composable only — no convenience prop APIs
      content: |
        # Composition-Only Component API

        RefineUI component APIs are **composable only**.

        ## Rules
        - **MUST**: Components must be usable via slot/subcomponent composition.
        - **MUST NOT**: Do not add convenience prop APIs like `title`, `description`, `items`, `actions`, `onClose`.
        - **MUST NOT**: Do not add single-prop render paths that bypass existing composition.
        - **MUST**: Root components are containers only; actual UI is split into subcomponents.
        - **MUST**: State/presentation/behavior extensions are exposed via subcomponents (e.g. `ComponentHeader`, `ComponentBody`, `ComponentAction`).
        - **MUST**: Documentation examples show the composable API only.

        ## Migration
        - Remove legacy convenience APIs incrementally.
        - When removing, update `packages/react/src/index.ts`, each component `index.ts`, and docs previews/mdx together.
        - Validate with `bun run build` and `bun run docs:build` after changes.

    - name: react-components
      path: ["packages/react/**/*.{tsx,ts}"]
      description: React component implementation rules for RefineUI
      content: |
        - Functional components + hooks
        - Define props with interface; avoid `any`
        - Match existing shipped components: same variants, composition model, and token usage as siblings in `packages/react/src/components/`
        - Read `docs/src/content/docs/components/<name>.mdx` and an existing implementation before adding APIs
        - Use @refineui/tokens and componentSizes/foundationSizes only — no hardcoded design values
        - Composable subcomponent API only — no convenience props
        - Consider a11y: semantics, ARIA, keyboard, focus

  skills:
    - name: review
      description: Code review with RefineUI checklist. Invoke when reviewing diffs or PRs.
      allowed_tools: [Read, Grep, Glob, "Bash(git:*)"]
      auto_invoke: false
      prompt: |
        # Review (required criteria)

        ## Scope
        MUST: Review all of — full diff, new dependencies, config and env changes.
        MUST NOT: Approve changes that add/remove/restructure packages/ — packages structure is fixed.

        ## Checklist (report only violations as file:line)
        1. Consistency: match existing naming, style, layout, patterns.
        2. Quality: single responsibility, no duplication, no magic values.
        3. Security: no secrets in code or logs; input validation required.
        4. Errors: failure cases, timeouts considered; error messages specific.
        5. Compatibility: no breaking API or behavior without documentation updates.
        6. Design system: tokens only (no hardcoded px/hex); composable APIs; docs/previews updated when public API changes.

        ## Output format
        MUST: Summary in 1–2 sentences (Approve / Conditional approve / Request changes).
        MUST: Only violated items as file:line and concrete description.
        If any item fails, conclude "Request changes".

    - name: design-system
      description: UI/design/token work from code and docs. Invoke for token or component tasks.
      allowed_tools: [Read, Write, Grep, Glob]
      auto_invoke: false
      paths: ["packages/react/**", "packages/tokens/**", "docs/**"]
      prompt: |
        # Design system (code-first)

        Apply system-core + design-system + tokens-in-components rules.

        ## Where to look
        - Tokens: `packages/tokens/src/global/*.ts`, `packages/tokens/src/semantic/*.ts`, `packages/tokens/README.md`
        - Components: `packages/react/src/components/<Name>/`, `packages/react/src/tokens/`
        - Docs: `docs/src/content/docs/foundations/`, `docs/src/content/docs/components/`
        - Previews: `docs/src/components/*Preview.tsx`, `docs/src/components/catalog/`

        ## Rules
        MUST: Use color, spacing, typography, stroke, radius, shadow, motion only from @refineui/tokens or component token maps.
        MUST: New tokens extend foundationSizes → componentSizes; rebuild tokens before react.
        MUST: New/changed components follow composable API patterns and update docs + catalog previews.
        MUST NOT: Hardcode hex/rgba or arbitrary px in component styles.

  agents: []

  forbidden:
    - "Hardcoding hex/rgba or arbitrary px in component styles"
    - "Adding component variants, props, or APIs beyond existing RefineUI patterns without token + docs updates"
    - "Convenience prop APIs (title, description, items, actions, onClose)"
    - "Secrets, keys, or tokens in code, commits, or comments"
    - "Changing packages/ layout or restructuring monorepo packages"
    - "Using any type in TypeScript"
    - "Changing dependency versions arbitrarily"

  cursor:
    always_apply_rules:
      - system-core
      - design-system
