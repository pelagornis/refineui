# Design System — Figma Foundation 기반
# RefineUI: Foundation URL을 단일 소스로 사용

meta:
  name: design-system.figma
  strict: true
  scope: design
  usage: "UI/디자인/토큰 관련 작업 시 system.core + 이 파일 적용"

prompt: |
  # Design System (Figma Foundation 기반)

  ## Foundation (단일 소스)
  - Figma: https://www.figma.com/design/GOLyxZSkzbRIuMNBvxeqr3/Pelagornis-RefineUI-Foundation?node-id=0-1
  - 코드: packages/tokens/src/global/*.ts

  ## 규칙
  MUST: 색상, 간격, 타이포그래피, stroke, radius, shadow는 Foundation 또는 @refineui/tokens에서만 사용.
  MUST: 새 컴포넌트/스타일 추가 시 Foundation에 정의된 토큰과 일치. Foundation에 없는 값은 추가 전 확인.
  MUST NOT: hex/rgba, px 값 하드코딩. tokens import 후 사용.
  MUST: Figma MCP로 디자인 가져올 때 Foundation URL 또는 해당 node-id 전달.
